name: Fort Boutique CI

on:
  push:
    paths:
      - 'fort-boutique/**'
      - '.github/workflows/fort-boutique.yml'
  pull_request:
    paths:
      - 'fort-boutique/**'
      - '.github/workflows/fort-boutique.yml'
  workflow_dispatch:

jobs:
  test:
    name: Tests, vérifications et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fort-boutique
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fort-boutique/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
