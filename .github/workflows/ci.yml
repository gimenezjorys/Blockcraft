name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-game:
    name: Syntaxe JS + solveur + générateur + jsdom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier index.html (node --check + Solver.validateLevels)
        run: node scripts/check-game.js index.html

      - name: Tests logiques (symétries, Sentier, défi du jour)
        run: node scripts/test-logic.js index.html

      - name: Installer jsdom
        run: npm install --no-save --no-package-lock jsdom@30.1.1

      - name: Tests jsdom (vrais KeyboardEvent / PointerEvent, sauvegardes, dates UTC, jardin vivant)
        run: node scripts/test-dom.js index.html

  e2e:
    name: Parcours joueur dans Chromium
    runs-on: ubuntu-latest
    needs: check-game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Playwright + Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Parcours de bout en bout
        run: node scripts/e2e-smoke.js e2e-captures

      - name: Tutoriel de Germain (premier lancement, reprise, joueur existant, accessibilité)
        run: node scripts/e2e-tutorial.js e2e-captures

      - name: Captures d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-captures
          path: e2e-captures
          if-no-files-found: ignore
