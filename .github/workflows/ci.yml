name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-game:
    name: Syntaxe JS + solveur des niveaux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier index.html (node --check + Solver.validateLevels)
        run: node scripts/check-game.js index.html
